version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg18

    container_name: docuflow-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: docuflow

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: